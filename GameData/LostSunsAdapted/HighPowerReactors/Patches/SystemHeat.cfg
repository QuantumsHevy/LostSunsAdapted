@PART[lsa-fr-GenFusionReactor]:NEEDS[SystemHeat]:FOR[LostSunsHighPowerReactors]
{
	!MODULE[ModuleCoreHeat] {}
	!MODULE[ModuleOverheatDisplay] {}
	MODULE
	{
		name = ModuleSystemHeat
		volume = 5.0
		moduleID = reactor
		iconName = Icon_Atom
	}
	@MODULE[ModuleHighPowerReactor]
	{
		!ThermalEfficiency {}
		!TemperatureModifier {}
		@GeneratesHeat = false
	}
	MODULE
	{
		name = ModuleSystemHeatBaseConverterAdapter
		moduleID = fusionreactor
		systemHeatModuleID = reactor
		// Position of ModuleHighPowerReactor in the part's modules. It must stay the first MODULE in the part cfg.
		converterModuleIndex = 0
		shutdownTemperature = 2000
		systemOutletTemperature = 1600
		systemPower = 8250
	}
}