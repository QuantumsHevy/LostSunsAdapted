// 1.25m (size1)
@PART[lsa-cd-UGDFcompact]:NEEDS[TweakScale]:FOR[CrunchDrives]
{
	%MODULE[TweakScale]
	{
		type = stack
		defaultScale = 1.25
		scaleFactors = 0.625, 1.25, 1.875, 2.5, 3.75, 5.0, 7.5, 10.0
	}
}

// 2.5m (size2)
@PART[lsa-cd-RespiteVariable,lsa-cd-Pointwatch*]:NEEDS[TweakScale]:FOR[CrunchDrives]
{
	%MODULE[TweakScale]
	{
		type = stack
		defaultScale = 2.5
		scaleFactors = 0.625, 1.25, 1.875, 2.5, 3.75, 5.0, 7.5, 10.0
	}
}