// Lost Suns Crunch Drives: Global Settings.
// These apply to every craft with a crunch drive and cannot be changed in-game.

LSA_CRUNCHDRIVES_SETTINGS
{
	// Time warp may be activated by the player during all spools and during crunches
    // that are longer than WarpMinLegSeconds. 
	allowTimeWarp = true

	// A crunch may start (and carry on) with other craft loaded nearby.
	allowNearbyCraft = true

	// Turn between the two legs (and onto retrograde at arrival) with the
    // MechJeb2-derived attitude controller. Setting this to false should switch to SAS.
	useTurnController = true

	// Scales every dropout sphere altitude above its body. Hard-limited to 1km above the
    // surface or atmosphere.
	dropoutSphereMultiplier = 1.0

	// A spool may start inside a dropout sphere, inside an atmosphere, or when the craft
    // is not pointing at its target. A crunch may start inside a dropout sphere or an
    // atmosphere if it heads out of the sphere (the craft must still be aligned to start
    // the crunch).
	looseStartConditions = true

	// Manual mode only: the crunch ignores every dropout sphere, so only the player
    // (or set diration) ends it. High risk of collisions and physics instability.
	ignoreDropoutSpheres = false
}